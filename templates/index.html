<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepsis CDSystem</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX transformation -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 p-4">
    <div id="root"></div>

    <script type="text/babel">
        // Main App component
        const App = () => {
            // List of all unique symptoms extracted from the provided dataset
            const allSymptoms = [
                "Abdominal Pain",
                "Abdominal Swelling",
                "Abnormal Body Movement",
                "Abnormal Crying",
                "Baby has not been breathing well",
                "Baby has not been feeding well",
                "Baby has not been sucking well",
                "Baby is feeling restless",
                "Baby is in Distress",
                "Bluish-black dislocation of feet and hand",
                "Changes in Body Temperature",
                "Cold hands and feet",
                "Colourish Skin",
                "Decreased Bowel Movement",
                "Diarrhea",
                "Difficulty in Breathing",
                "Excessive Crying",
                "Fast Breathing",
                "Fast Heart Rate",
                "Fever",
                "Fever After Delivery",
                "Frequent cry and stops after attempt of feeding",
                "Inability to respond adequately",
                "Irregular Breathing",
                "Irregular pauses in breathing",
                "Limp at Birth",
                "Low Blood Sugar",
                "Low Heart Rate",
                "No body movement",
                "Noisy Breathing",
                "Passage of Stool",
                "Persistent Crying",
                "Poor Cry",
                "Poor Feeding",
                "Poor Muscle Tone",
                "Poor Suck",
                "Prematurity",
                "Prolonged PROM",
                "Rashes",
                "Reduced Body Movement",
                "Reduced Sucking",
                "Refusal to Suck",
                "Respiratory Distress",
                "Restlessness",
                "Risk for Sepsis",
                "Seizures",
                "Slow Heart Rate",
                "Stooling",
                "Swelling at the lateral region of the neck",
                "Swollen Belly",
                "Weak Breathing",
                "Weak Cry",
                "Yellow Eyes",
                "Yellowish Skin"
            ];

            // State to hold the currently selected symptoms
            const [selectedSymptoms, setSelectedSymptoms] = React.useState([]);
            // State for the prediction result
            const [predictionResult, setPredictionResult] = React.useState(null);
            // State for displaying the informational message
            const [infoMessage, setInfoMessage] = React.useState(null);
            // State to control the visibility of the pop-up
            const [isModalOpen, setIsModalOpen] = React.useState(false);

            // Function to handle checkbox changes
            const handleSymptomChange = (symptom) => {
                setSelectedSymptoms(prevSelected => {
                    if (prevSelected.includes(symptom)) {
                        return prevSelected.filter(s => s !== symptom);
                    } else {
                        return [...prevSelected, symptom];
                    }
                });
                setPredictionResult(null); // Clear previous result on change
                setInfoMessage(null); // Clear info message on change
            };

            // Function to process symptoms and get a prediction
            const getPrediction = async () => {
                setPredictionResult("Loading...");
                setIsModalOpen(true); // Open the modal immediately with a loading message

                try {
                    // Send the symptoms to the Flask backend for diagnosis
                    const response = await fetch('/diagnose', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ symptoms: selectedSymptoms }),
                    });

                    // Check if the response is successful
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }

                    // Parse the JSON response
                    const data = await response.json();
                    
                    // Update the prediction result with the response from the backend
                    setPredictionResult(data.prediction);
                    setInfoMessage(null);
                } catch (error) {
                    // Handle any errors during the fetch request
                    console.error("Error fetching prediction:", error);
                    setPredictionResult("Error: Could not connect to backend.");
                    setInfoMessage("Please ensure your Flask backend is running and the '/diagnose' route is configured correctly.");
                }
            };

            // Modal component to display the prediction
            const PredictionModal = ({ prediction, isOpen, onClose }) => {
                if (!isOpen) return null;
            
                return (
                    <div className="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full flex items-center justify-center">
                        <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md mx-auto relative">
                            <button
                                onClick={onClose}
                                className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                            <div className="text-center">
                                <h3 className="text-2xl font-bold text-gray-800 mb-4">Prediction Result</h3>
                                {prediction === "Loading..." ? (
                                    <p className="text-xl text-gray-500">{prediction}</p>
                                ) : (
                                    <p className="text-3xl font-bold text-indigo-600 font-mono">{prediction}</p>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4 font-sans">
                    <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-2xl">
                        <h1 className="text-3xl font-bold text-center text-gray-800 mb-6">Neonatal Sepsis CDSystem</h1>
                        <p className="text-center text-gray-600 mb-8">
                            Select your baby's symptoms below to get a preliminary assessment.
                        </p>

                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                            {allSymptoms.map((symptom, index) => (
                                <div key={index} className="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg border border-gray-200 hover:bg-gray-100 transition duration-200">
                                    <input
                                        type="checkbox"
                                        id={`symptom-${index}`}
                                        checked={selectedSymptoms.includes(symptom)}
                                        onChange={() => handleSymptomChange(symptom)}
                                        className="h-5 w-5 text-indigo-600 bg-gray-100 border-gray-300 rounded focus:ring-indigo-500"
                                    />
                                    <label htmlFor={`symptom-${index}`} className="text-gray-700 select-none">
                                        {symptom}
                                    </label>
                                </div>
                            ))}
                        </div>

                        <div className="flex justify-center">
                            <button
                                onClick={getPrediction}
                                disabled={selectedSymptoms.length === 0}
                                className={`
                                    px-8 py-3 rounded-full text-white font-semibold transition-all duration-300
                                    ${selectedSymptoms.length > 0
                                        ? 'bg-indigo-600 hover:bg-indigo-700 transform hover:scale-105 shadow-md'
                                        : 'bg-indigo-300 cursor-not-allowed'
                                    }
                                `}
                            >
                                Get Prediction
                            </button>
                        </div>
                        
                        {infoMessage && (
                            <div className="mt-8 text-center text-sm p-4 bg-yellow-100 text-yellow-800 rounded-lg shadow-sm">
                                {infoMessage}
                            </div>
                        )}
                    </div>
                    <PredictionModal
                        prediction={predictionResult}
                        isOpen={isModalOpen}
                        onClose={() => setIsModalOpen(false)}
                    />
                </div>
            );
        };

        // Mount the App component
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
