<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepsis CDSystem</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX transformation -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        :root {
            --primary-color: #059669;
            --primary-color-light: #d1fae5;
            --primary-color-dark: #047857;
            --gray-bg: #f3f4f6;
            --gray-card: #ffffff;
            --gray-border: #e5e7eb;
            --gray-text: #374151;
            --gray-muted: #6b7280;
        }
        .bg-primary { background-color: var(--primary-color) !important; }
        .bg-primary-light { background-color: var(--primary-color-light) !important; }
        .bg-primary-dark { background-color: var(--primary-color-dark) !important; }
        .text-primary { color: var(--primary-color) !important; }
        .border-primary { border-color: var(--primary-color) !important; }
        .hover\:bg-primary-dark:hover { background-color: var(--primary-color-dark) !important; }
        .focus\:ring-primary:focus { box-shadow: 0 0 0 3px rgba(5,150,105,0.3) !important; }
        .app-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: var(--gray-card);
            border-radius: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 2.25rem;
            font-weight: 700;
            color: #1f2937;
        }
        .header p {
            font-size: 1rem;
            color: var(--gray-muted);
            margin-top: 0.5rem;
        }
        .symptom-list {
            display: grid;
            gap: 1rem;
        }
        .symptom-item {
            background-color: var(--gray-border);
            border-radius: 1rem;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            border: 2px solid transparent;
        }
        .symptom-item.selected {
            background-color: var(--primary-color-light);
            border: 2px solid var(--primary-color);
        }
        .symptom-label {
            font-weight: 500;
            color: var(--gray-text);
            flex-grow: 1;
        }
        .symptom-checkbox {
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 0.25rem;
            border: 2px solid var(--gray-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .symptom-item.selected .symptom-checkbox {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        .symptom-checkbox svg {
            display: none;
        }
        .symptom-item.selected .symptom-checkbox svg {
            display: block;
        }
        .diagnose-button {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            border-radius: 1rem;
            transition: background-color 0.2s ease;
            margin-top: 2rem;
            cursor: pointer;
            text-align: center;
        }
        .diagnose-button:hover {
            background-color: var(--primary-color-dark);
        }
    </style>
</head>
<body class="bg-primary-light p-4">
    <div id="root"></div>

    <script type="text/babel">
        // Main App component
        const App = () => {
            // List of all unique symptoms extracted from the provided dataset
            const allSymptoms = [
                "Abdominal Pain",
                "Abdominal Swelling",
                "Abnormal Body Movement",
                "Abnormal Crying",
                "Baby has not been breathing well",
                "Baby has not been feeding well",
                "Baby has not been sucking well",
                "Baby is feeling restless",
                "Baby is in Distress",
                "Bluish-black dislocation of feet and hand",
                "Changes in Body Temperature",
                "Cold hands and feet",
                "Colourish Skin",
                "Decreased Bowel Movement",
                "Diarrhea",
                "Difficulty in Breathing",
                "Excessive Crying",
                "Fast Breathing",
                "Fast Heart Rate",
                "Fever",
                "Fever After Delivery",
                "Frequent cry and stops after attempt of feeding",
                "Inability to respond adequately",
                "Irregular Breathing",
                "Irregular pauses in breathing",
                "Limp at Birth",
                "Low Blood Sugar",
                "Low Heart Rate",
                "No body movement",
                "Noisy Breathing",
                "Passage of Stool",
                "Persistent Crying",
                "Poor Cry",
                "Poor Feeding",
                "Poor Muscle Tone",
                "Poor Suck",
                "Prematurity",
                "Prolonged PROM",
                "Rashes",
                "Reduced Body Movement",
                "Reduced Sucking",
                "Refusal to Suck",
                "Respiratory Distress",
                "Restlessness",
                "Risk for Sepsis",
                "Seizures",
                "Slow Heart Rate",
                "Stooling",
                "Swelling at the lateral region of the neck",
                "Swollen Belly",
                "Weak Breathing",
                "Weak Cry",
                "Yellow Eyes",
                "Yellowish Skin"
            ];

            // State to hold the currently selected symptoms
            const [selectedSymptoms, setSelectedSymptoms] = React.useState([]);
            // State for the prediction result
            const [predictionResult, setPredictionResult] = React.useState(null);
            // State for displaying the informational message
            const [infoMessage, setInfoMessage] = React.useState(null);
            // State to control the visibility of the pop-up
            const [isModalOpen, setIsModalOpen] = React.useState(false);

            // Function to handle checkbox changes
            const handleSymptomChange = (symptom) => {
                setSelectedSymptoms(prevSelected => {
                    if (prevSelected.includes(symptom)) {
                        return prevSelected.filter(s => s !== symptom);
                    } else {
                        return [...prevSelected, symptom];
                    }
                });
                setPredictionResult(null); // Clear previous result on change
                setInfoMessage(null); // Clear info message on change
            };

            // Function to process symptoms and get a prediction
            const getPrediction = async () => {
                setPredictionResult("Loading...");
                setIsModalOpen(true); // Open the modal immediately with a loading message

                try {
                    // Send the symptoms to the Flask backend for diagnosis
                    const response = await fetch('/diagnose', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ symptoms: selectedSymptoms }),
                    });

                    // Check if the response is successful
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }

                    // Parse the JSON response
                    const data = await response.json();
                    
                    // Update the prediction result with the response from the backend
                    setPredictionResult(data.prediction);
                    setInfoMessage(null);
                } catch (error) {
                    // Handle any errors during the fetch request
                    console.error("Error fetching prediction:", error);
                    setPredictionResult("Error: Could not connect to backend.");
                    setInfoMessage("Please ensure your Flask backend is running and the '/diagnose' route is configured correctly.");
                }
            };

            // Modal component to display the prediction
            const PredictionModal = ({ prediction, isOpen, onClose }) => {
                if (!isOpen) return null;
            
                return (
                    <div className="fixed inset-0 bg-primary-dark bg-opacity-60 overflow-y-auto h-full w-full flex items-center justify-center">
                        <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md mx-auto relative">
                            <button
                                onClick={onClose}
                                className="absolute top-4 right-4 text-primary hover:text-primary-dark transition-colors"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                            <div className="text-center">
                                <h3 className="text-2xl font-bold text-primary mb-4">Prediction Result</h3>
                                {prediction === "Loading..." ? (
                                    <p className="text-xl text-primary opacity-70">{prediction}</p>
                                ) : (
                                    <p className="text-3xl font-bold text-primary font-mono">{prediction}</p>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-gray-100 p-4 sm:p-8">
                    <div className="app-container">
                        <div className="header">
                            <h1 className="text-3xl sm:text-4xl font-extrabold text-gray-800">Clinical Decision Support System for Neonatal Sepsis</h1>
                            <p className="text-sm sm:text-base text-gray-500 mt-2">
                                A final year project by: Ajayi Chibueze Adeyemi CPE/19/1284
                            </p>
                        </div>
                        <div className="symptom-list grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            {allSymptoms.map((symptom, index) => {
                                const selected = selectedSymptoms.includes(symptom);
                                return (
                                    <div
                                        key={index}
                                        className={`symptom-item${selected ? ' selected' : ''}`}
                                        onClick={() => handleSymptomChange(symptom)}
                                    >
                                        <span className="symptom-label">{symptom}</span>
                                        <span className="symptom-checkbox">
                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4 text-white" viewBox="0 0 20 20" fill="currentColor">
                                                <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" />
                                            </svg>
                                        </span>
                                    </div>
                                );
                            })}
                        </div>
                        <div
                            className="diagnose-button"
                            style={{ display: selectedSymptoms.length > 0 ? 'block' : 'none' }}
                            onClick={getPrediction}
                        >
                            Get Prediction
                        </div>
                        {infoMessage && (
                            <div className="mt-8 text-center text-sm p-4 bg-yellow-100 text-yellow-800 rounded-lg shadow-sm">
                                {infoMessage}
                            </div>
                        )}
                    </div>
                    <PredictionModal
                        prediction={predictionResult}
                        isOpen={isModalOpen}
                        onClose={() => setIsModalOpen(false)}
                    />
                </div>
            );
        };

        // Mount the App component
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
