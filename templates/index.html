<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepsis CDSystem</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX transformation -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .diagnose-button {
            width: 100%;
            padding: 1rem;
            background-color: #10b981;
            color: white;
            font-weight: 600;
            border-radius: 1rem;
            transition: background-color 0.2s ease;
            margin-top: 2rem;
            cursor: pointer;
            text-align: center;
        }
        .diagnose-button:hover {
            background-color: #059669;
        }
        .symptom-list {
            display: grid;
            gap: 1rem;
        }
        .symptom-item {
            background-color: #e5e7eb;
            border-radius: 1rem;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .symptom-item.selected {
            background-color: #d1fae5;
            border: 2px solid #10b981;
        }
        .symptom-label {
            font-weight: 500;
            color: #374151;
            flex-grow: 1;
        }
        .symptom-checkbox {
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 0.25rem;
            border: 2px solid #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .symptom-item.selected .symptom-checkbox {
            background-color: #10b981;
            border-color: #10b981;
        }
        .symptom-checkbox svg {
            display: none;
        }
        .symptom-item.selected .symptom-checkbox svg {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-100 p-4">
    <div id="root"></div>

    <script type="text/babel">
        // Main App component
        const App = () => {
            // List of all unique symptoms extracted from the provided dataset
            const allSymptoms = [
                "Poor Feeding or Reduced Sucking",
                "Lethargy or Reduced Spontaneous Activity",
                "Temperature Instability (Fever or Hypothermia)",
                "Breathing Problems or Apnea (pauses in breathing)",
                "Irritability or Increased Crankiness",
                "Vomiting or Diarrhea",
                "Jaundice (Yellowing of Skin/Eyes)",
                "Abdominal Distention (Swollen Belly)",
                "Changes in Heart Rate (Fast or Slow)",
                "Cold or Clammy Skin",
                "Pale or Mottled Skin",
                "Seizures",
                "Bulging Fontanelle (Soft Spot on Head)"
            ];

            // State to hold the currently selected symptoms
            const [selectedSymptoms, setSelectedSymptoms] = React.useState([]);
            // State for the prediction result
            const [predictionResult, setPredictionResult] = React.useState(null);
            const [accuracy, setAccuracy] = React.useState(null);
            // State for displaying the informational message
            const [infoMessage, setInfoMessage] = React.useState(null);
            // State to control the visibility of the pop-up
            const [isModalOpen, setIsModalOpen] = React.useState(false);

            // Function to handle checkbox changes
            const handleSymptomChange = (symptom) => {
                setSelectedSymptoms(prevSelected => {
                    if (prevSelected.includes(symptom)) {
                        return prevSelected.filter(s => s !== symptom);
                    } else {
                        return [...prevSelected, symptom];
                    }
                });
                setPredictionResult(null); // Clear previous result on change
                setInfoMessage(null); // Clear info message on change
            };

            // Function to process symptoms and get a prediction
            const getPrediction = async () => {
                setPredictionResult("Loading...");
                setIsModalOpen(true); // Open the modal immediately with a loading message

                try {
                    // Send the symptoms to the Flask backend for diagnosis
                    const response = await fetch('https://neonatal-sepsis-cdss.onrender.com/diagnose', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ symptoms: selectedSymptoms }),
                    });

                    // Check if the response is successful
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }

                    // Parse the JSON response
                    const data = await response.json();
                    
                    // Update the prediction result with the response from the backend
                    setPredictionResult(data.prediction);
                    setAccuracy(data.accuracy);
                    setInfoMessage(null);
                } catch (error) {
                    // Handle any errors during the fetch request
                    console.error("Error fetching prediction:", error);
                    setPredictionResult("Error: Could not connect to backend.");
                    setInfoMessage("Please ensure your Flask backend is running and the '/diagnose' route is configured correctly.");
                }
            };

            // Modal component to display the prediction
            const PredictionModal = ({ prediction, isOpen, onClose }) => {
                if (!isOpen) return null;
            
                return (
                    <div className="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full flex items-center justify-center">
                        <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md mx-auto relative">
                            <button
                                onClick={onClose}
                                className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                            <div className="text-center">
                                <h3 className="text-2xl font-bold text-gray-800 mb-4">Prediction Result</h3>
                                {prediction === "Loading..." ? (
                                    <p className="text-xl text-gray-500">{prediction}</p>
                                ) : (
                                    <div className="space-y-4 flex flex-col items-center">
                                        <p className="text-3xl font-bold text-indigo-600 font-mono">{prediction}</p>
                                        <p className="text-3xl text-[#10b981] font-extrabold text-indigo-600 font-mono">{accuracy}</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4 font-sans">
                    <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-2xl">
                        <div class="header flex flex-col items-center space-y-2 mb-8">
                        <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-800 text-center">Clinical Decision Support System for Neonatal Sepsis</h1>
                        <p class="text-sm sm:text-base text-gray-500 mt-2">
                            A final year project by: Ajayi Chibueze Adeyemi CPE/19/1284
                        </p>
                    </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                            {allSymptoms.map((symptom, index) => (
                                <div key={index} className="symptom-item flex flex-row space-x-3">
                                    <input
                                        type="checkbox"
                                        id={`symptom-${index}`}
                                        checked={selectedSymptoms.includes(symptom)}
                                        onChange={() => handleSymptomChange(symptom)}
                                        className="symptom-checkbox"
                                    />
                                    <label htmlFor={`symptom-${index}`} className="symptom-label">
                                        {symptom}
                                    </label>
                                </div>
                            ))}
                        </div>

                        <div className="flex justify-center w-full">
                            <button
                                id="diagnose-button" className="diagnose-button"
                                onClick={getPrediction}
                                disabled={selectedSymptoms.length === 0}
                            >
                                Get Prediction
                            </button>
                        </div>
                        
                        {infoMessage && (
                            <div className="mt-8 text-center text-sm p-4 bg-yellow-100 text-yellow-800 rounded-lg shadow-sm">
                                {infoMessage}
                            </div>
                        )}
                    </div>
                    <PredictionModal
                        prediction={predictionResult}
                        isOpen={isModalOpen}
                        onClose={() => setIsModalOpen(false)}
                    />
                </div>
            );
        };

        // Mount the App component
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
